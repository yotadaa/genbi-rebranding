<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event | GenBI Provinsi Jambi</title>
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="bg-stone py-16 md:py-24">
      <div class="site-container fade-up">
        <p class="eyebrow">Event</p>
        <h1 class="page-title mt-5 max-w-4xl">Agenda dan kegiatan GenBI Jambi.</h1>
        <p class="lead mt-7 max-w-3xl">Daftar kegiatan komunitas yang sudah dan akan dilaksanakan oleh GenBI Provinsi Jambi.</p>
      </div>
    </section>
    <section class="bg-cream py-12 md:py-16">
      <div class="site-container">
        <div class="fade-up mb-8 grid gap-3 rounded-[1.75rem] border border-neutral-900/10 bg-white/80 p-4 shadow-sm md:grid-cols-[1fr_180px]">
          <input id="event-search" class="input-soft" placeholder="Cari event, lokasi, atau topik" />
          <button id="event-reset" class="chip" type="button">Reset</button>
        </div>
        <div class="fade-up mb-5 text-sm text-neutral-600" id="event-count"></div>
        <div class="fade-up event-grid" id="event-list"></div>
        <div class="public-pagination mt-8" id="event-pagination" aria-label="Pagination event"></div>
      </div>
    </section>
  </main>
  <div id="event-modal" class="public-fixed-modal hidden"></div>
  <div id="site-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/api-core.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/lib/ui.js"></script>
  <script src="assets/js/pages/event.js"></script>
</body>
</html>
